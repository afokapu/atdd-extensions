schema_version: "1.0.0"

artifact_id: atdd.extension.coder.bun
kind: extension
status: official
publisher: atdd

source:
  repository: ./official/atdd.extension.coder.bun
  type: local

version: "0.1.0"

compatible_atdd_core:
  minimum: "0.1.0"

requires_workspaces:
  - id: atdd.workspace.bun
    contract: "^1.0.0"

categories:
  - coder
  - bun
  - typescript
  - traceability
  - clean-architecture
  - source-validator
  - official

description: >-
  Official ATDD coder-role extension for the Bun / TypeScript runtime — 45 convention nodes across
  six families: GREEN/URN traceability (extended to .html templates), TypeScript metrics ported
  natively from python-pytest, security / logging / error-response hygiene, clean architecture
  (layering, composition, DTOs, boundaries, naming), the Bun runtime decisions themselves (including the
  advisory typecheck rule that closes Bun's own gap — it strips types rather than checking them),
  and train INTERLOCKING route control — the InterlockingRunner exists, resolves a structured
  InterlockingResolution, delegates to TrainRunner, never touches Cargo, is reached from the
  server.ts Station Master, and closes bilaterally against the declared route space.
  Pair it with atdd.extension.tester.bun; add atdd.extension.coder.htmx only if the app serves
  hypermedia.
