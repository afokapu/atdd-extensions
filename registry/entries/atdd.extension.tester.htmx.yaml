schema_version: "1.0.0"

artifact_id: atdd.extension.tester.htmx
kind: extension
status: official
publisher: atdd

source:
  repository: ./official/atdd.extension.tester.htmx
  type: local

version: "0.1.0"

compatible_atdd_core:
  minimum: "0.1.0"

requires_workspaces:
  - id: atdd.workspace.bun
    contract: "^1.0.0"

categories:
  - tester
  - htmx
  - hypermedia
  - official

description: >-
  Official ATDD tester-role extension for htmx endpoint tests — the obligation that a test asserts
  on the returned FRAGMENT rather than only its status line, because in htmx the response contract
  is the markup. No other stack's tester extension carries this rule.
