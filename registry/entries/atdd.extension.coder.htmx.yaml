schema_version: "1.0.0"

artifact_id: atdd.extension.coder.htmx
kind: extension
status: official
publisher: atdd

source:
  repository: ./official/atdd.extension.coder.htmx
  type: local

version: "0.1.0"

compatible_atdd_core:
  minimum: "0.1.0"

# The runtime this extension's obligations are realized on. The conventions are
# stack-bound (htmx + Bun) but runtime-agnostic in principle: a second provider
# could realize the same nine rule_ids without this package changing.
requires_workspaces:
  - id: atdd.workspace.bun
    contract: "^1.0.0"

categories:
  - coder
  - htmx
  - bun
  - hypermedia
  - source-validator
  - official

description: >-
  Official ATDD coder-role extension for the full-stack Bun + htmx stack — 33 convention nodes
  across five families. GREEN/URN traceability (the Bun realization of the stack-neutral header
  obligation Python and Vite also realize, extended to .html templates); hypermedia discipline
  (oob ids, confirmations, progress signals, same-origin endpoints, fragment escaping); and Bun
  runtime discipline (Bun.serve, one lockfile, bun:test); and the seven TypeScript metric
  obligations ported natively from python-pytest, so the stack needs no Python interpreter;
  and security, logging and error-response hygiene. Coder persona only — no tester extension yet.
