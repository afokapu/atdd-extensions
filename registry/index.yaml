  summary: "Official ATDD coder-role extension for train interlocking \u2014 the CODER half of the persona\
    \ split (afokapu/atdd#1531). Six convention nodes enforcing that a consumer declaring guarded routes\
    \ ships a real route-control layer: an InterlockingRunner exists with a resolve_train entry point,\
    \ resolves a structured InterlockingResolution rather than a bare train_id, delegates execution to\
