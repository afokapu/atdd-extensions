# Composition gate (afokapu/atdd#1132): continuously prove every package in this repo
# still COMPOSES against installed ATDD core. Installs the atdd toolkit (which ships the
# composition CLI + the core nodes/schema as package data) and runs `atdd validate
# package` — load/validate/compose only, NO runtime execution, and NO composition
# semantics are defined here (they live in atdd core: compose.py / feature
# author-atdd-substrate:package-composition).
name: validate-packages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compose-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ATDD toolkit (composition CLI + core nodes via package-data)
        run: pip install "git+https://github.com/afokapu/atdd.git@main"

      - name: Validate every OFFICIAL package composes against installed core
        # Scope: official/ packages are the composition guarantee consumers rely on.
        # examples/ are illustrative (may intentionally be partial) and are NOT gated.
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for pkg in official/*/; do
            [ -f "$pkg/atdd.extension.yaml" ] || [ -f "$pkg/atdd.workspace.yaml" ] || continue
            found=1
            echo "::group::atdd validate package $pkg"
            atdd validate package "$pkg"   # exits non-zero on any composition violation
            echo "::endgroup::"
          done
          if [ "$found" = 0 ]; then echo "::error::no official packages discovered to validate"; exit 1; fi

      - name: Every relationship graph conforms to core's edge schema
        # `atdd validate package` enforces planner.relationship.no-orphan-nodes but
        # never applies relationship.schema.json to an extension's edges, and never
        # checks the reverse direction — an edge citing a node that does not exist.
        # Both gaps were live in this repo: 188 edges used `type` values outside
        # core's enum, three packages used a second key shape (from/to/rationale),
        # and one graph referenced a node after it had moved packages.
        run: python3 tools/validate_graphs.py

      - name: The registry index still matches its authored entries
        # registry/index.yaml is the core-consumable projection of registry.yaml +
        # entries/. Regenerate it after editing any entry, or `atdd substrate add
        # <ref>` resolves against a stale catalog.
        run: python3 tools/build_registry_index.py --check

      - name: Negative canary — the gate rejects an invalid realization
        # Proves the gate has teeth (criteria 3-6). The full negative contract — bad
        # manifest shape, unresolved core node, realized design_candidate, authored
        # cross-package edge — is enforced by `atdd validate package` and covered by
        # atdd core's C007 acceptance tests; here we exercise one representative case.
        run: |
          set -euo pipefail
          broken="$RUNNER_TEMP/broken-extension"
          cp -r official/atdd.extension.github "$broken"
          python - "$broken/atdd.extension.yaml" <<'PY'
          import sys, yaml
          p = sys.argv[1]
          d = yaml.safe_load(open(p))
          d.setdefault("realizes", []).append({
              "extension_node": "github.state.sync-store-from-issues",
              "core_node": "coach.bogus.does-not-exist",   # unresolved -> must fail
          })
          yaml.safe_dump(d, open(p, "w"), sort_keys=False)
          PY
          if atdd validate package "$broken"; then
            echo "::error::composition gate FAILED to reject an invalid realization"
            exit 1
          fi
          echo "✓ gate correctly rejected the broken package"

  # Provider conformance: a REAL pytest run proving atdd.workspace.python-pytest
  # satisfies its workspace-provider contract (discover + run → violation-output).
  # The compose-gate above only proves manifests load/validate; this proves the
  # provider's adapter mechanics actually work. Runner-specific and independent of
  # the composition gate, so it runs as its own job.
  provider-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install conformance deps
        run: pip install pytest pyyaml

      - name: Run atdd.workspace.python-pytest provider conformance
        run: pytest official/atdd.workspace.python-pytest/conformance/ -v

      - name: Run atdd.workspace.cmux-claude provider conformance
        # REAL suite — subprocess round-trip + durable feed + two-way channel. No
        # cmux binary / Claude API needed (the agent command is injected).
        run: pytest official/atdd.workspace.cmux-claude/conformance/ -v

  # Real end-to-end: the python-pytest provider DISCOVERS every github extension
  # implementation manifest and RUNS its suite. Proves the provider<->implementation
  # contract chain works, not just that manifests load.
  github-implementations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pytest pyyaml

      - name: Provider discovers + runs every github implementation
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("official/atdd.workspace.python-pytest/adapter").resolve()))
          import discover, run
          ext = Path("official/atdd.extension.github/implementations").resolve()
          impls = discover.discover_implementations(ext)
          assert len(impls) == 2, f"expected 2 implementations, discovered {len(impls)}"
          failed = []
          for i in impls:
              res = run.run_implementation(i.implementation_id, i.manifest_path.parent)
              print(f"[{'PASS' if res.passed else 'FAIL'}] {i.implementation_id} exit={res.exit_code}")
              if not res.passed:
                  failed.append(i.implementation_id)
                  print(res.stdout[-800:])
          if failed:
              sys.exit(f"implementations failed: {failed}")
          print("all 2 github implementations discovered and green")
          PY

  # LIVE smoke for the controlled-language gate: the ONLY job that needs a container.
  #
  # Every other test in this repo mocks its HTTP. That proves our logic and cannot prove the seam:
  # that a REAL LanguageTool server answers a shape we parse, that its offsets land on the prose we
  # sent, and that a REAL connection refusal fails closed. This job proves those against a live
  # server and a genuinely dead TCP port.
  #
  # ATDD_STE_LIVE=1 turns a SKIP into a FAILURE inside this job. Without it a missing/dead server
  # would skip silently and the badge would still go green — a live smoke that can quietly skip is
  # theatre. The mocked suite stays the fast path and runs here too, unchanged.
  controlled-language-live-smoke:
    runs-on: ubuntu-latest

    services:
      languagetool:
        # Upstream LanguageTool serves the /v2/check API this gate speaks. It carries no
        # ASD-STE100 rules — TechScribe owns those — which is fine: this job proves the ROUND TRIP
        # and the record mapping, not the STE rule set.
        image: erikvl87/languagetool:latest
        ports:
          - 8081:8010

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pytest pyyaml

      - name: Wait for LanguageTool to answer /v2/check
        # The container is up long before the JVM serves requests, so poll the real endpoint
        # rather than trust readiness. Failing here is a broken job, not a broken gate.
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl -sf -d "language=en-US" --data-urlencode "text=ready" \
                 http://127.0.0.1:8081/v2/check >/dev/null 2>&1; then
              echo "LanguageTool answered after ~$((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "::error::LanguageTool did not answer /v2/check within 120s"
          exit 1

      - name: Record the REAL response shape
        # Diagnostics, not a gate: prints what the server actually returns so a shape change is
        # readable straight from the log instead of inferred from an assertion failure.
        run: |
          curl -s -d "language=en-US" --data-urlencode "text=The wagon recieve the cargo." \
            http://127.0.0.1:8081/v2/check | python3 -m json.tool | head -80

      - name: Live round trip + real fail-closed
        env:
          ATDD_STE_URL: http://127.0.0.1:8081/v2/check
          ATDD_STE_LIVE: "1"
        run: |
          pytest official/atdd.extension.planner.controlled-language/implementations/controlled-language-check \
            -v -rs

      - name: Prove the live tests did not skip
        # The control on the control. If the live tests ever start skipping in the job built to run
        # them, this fails the build instead of letting a green badge certify nothing.
        env:
          ATDD_STE_URL: http://127.0.0.1:8081/v2/check
          ATDD_STE_LIVE: "1"
        run: |
          set -euo pipefail
          out=$(pytest official/atdd.extension.planner.controlled-language/implementations/controlled-language-check/test_live_smoke.py -q 2>&1)
          echo "$out"
          if echo "$out" | grep -qi "skipped"; then
            echo "::error::live smoke SKIPPED in the live job — the round trip is unproven"
            exit 1
          fi
