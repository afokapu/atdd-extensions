schema_version: "1.0.0"

# First-class workspace PROVIDER: a reusable, domain-agnostic runtime that the
# full-stack Bun extensions (atdd.extension.coder.htmx and its tester sibling)
# target. Namespaced id (scope segment is `workspace`):
#   <publisher>.workspace.<name>
#
# FULL-STACK BUN. Bun is not merely the test runner here — it is the server
# runtime (Bun.serve), the bundler, the package manager and the test runner. That
# breadth lives in the RUNTIME descriptor and in the conventions the extensions
# own; it does NOT invent new capability contracts. The engine speaks exactly one
# execution contract (`...capability.execution.command-runner.v1`), and a provider
# that invented a second would be unresolvable by core's binder. So this provider
# claims the SAME single capability every other runtime claims, and simply runs
# its detectors under `bun` instead of `node`/`pytest`.
#
# Forked from frontend.workspace.runtime (the first real JS provider) rather than
# from the former atdd.workspace.typescript skeleton: that skeleton was
# NotImplementedError stubs wired to vitest/pnpm assumptions, whereas the frontend
# runtime is a working v1.1 adapter. The delta is the run command and the detector
# corpus. (The skeleton was retired once it was shown to own no implementation and
# to be depended on by nothing: the `*-typescript` rules it appeared to serve are
# all realized by detectors targeting atdd.workspace.python-pytest.)
workspace_id: atdd.workspace.bun
kind: workspace
version: "0.1.0"

# Discovery + run CONTRACT this provider implements — the SAME contract as
# atdd.workspace.python-pytest v1.1.0 and frontend.workspace.runtime v1.1.0
# (scan-mount env channel + structured JSON violation report). Implementations
# declare the contract they satisfy (`contract_version`); the resolver checks
# SemVer compatibility against this value, refusing on mismatch.
contract_version: "1.1.0"

# Typed CAPABILITIES this workspace provides (#1138). Exactly one, deliberately:
# an execution command-runner. `bun test` is the runner; because Bun executes
# `.mjs`/`.ts` directly with no build step and no node_modules, the detectors run
# dependency-free under the plain `bun` command.
capabilities:
  - capability_id: execution.bun
    domain: execution
    type: test-runner
    contract: atdd.workspace.capability.execution.command-runner.v1
    runtime:
      language: typescript
      runner: bun
      package_manager: bun
      command: bun

# Shared runtime files materialized into each workspace INSTANCE at resolve time.
# Bun needs none: it runs TypeScript and ESM natively, so the detectors carry zero
# dependencies and require no package.json, tsconfig or bundler config to execute.
shared_runtime:
  files: []

# How this provider finds the executable units an extension ships, and the
# provider-contract range those implementations must satisfy.
discovers:
  implementations:
    - "**/atdd.implementation.yaml"
  requires_contract: "^1.0.0"

# A new runtime proves it satisfies the SAME contract by passing this suite.
conformance:
  suite: conformance/

# Conventions are owned by the extensions that depend on this runtime, never here.
governed_by_conventions: []
