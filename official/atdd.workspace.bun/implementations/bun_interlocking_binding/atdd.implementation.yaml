schema_version: 1.1.0
kind: implementation
subtype: validator
implementation_id: bun_interlocking_binding
targets_workspace: atdd.workspace.bun
contract_version: 1.1.0
# Bun/TS realization of the core python `interlocking_binding.py` detector, mirroring
# convex.workspace.runtime's convex_interlocking_binding 1:1. ONE rule_id, FIVE binding
# directions — the failing direction is named in the evidence, never in a new rule_id.
#
# PERSONA NOTE. Four directions read SOURCE (src/trains/**, server.ts) and the declared
# route space (plan/**). The fifth, `trace_to_declaration`, reads e2e trace tests — as it
# does in the python original and the Convex mirror, because the obligation is FIVE-way
# closure and dropping a direction would make the rule a partial claim. This provider's
# conformance/test_persona_scoping.py forbids a coder family reading a test file; the
# guard it applies is a test-ONLY tree, on which this detector finds no consumer root and
# emits nothing. The tension is real and is flagged for a ruling rather than resolved
# silently — see the extension README.
realizes_convention:
- coder.bun.interlocking-bilateral-binding
emits_rule_ids:
- coder.bun.interlocking-bilateral-binding
entrypoint: detect.mjs
report: detect.mjs
