schema_version: 1.1.0
kind: implementation
subtype: validator
implementation_id: bun_interlocking_coverage
targets_workspace: atdd.workspace.bun
contract_version: 1.1.0
# Bun/TS realization of the core python `interlocking_coverage.py` detector, mirroring
# convex.workspace.runtime's convex_interlocking_coverage 1:1 — four strict
# tester.bun.interlocking-* rule_ids from ONE implementation (Core FAMILY pattern).
#
# TESTER PERSONA. This family reads the declared route space (plan/**) and the consumer's
# TEST files, and never reports on source. It is registered in
# conformance/test_persona_scoping.py's tester set for exactly that reason — the coder
# side of interlocking is bun_interlocking_infrastructure.
realizes_convention:
- tester.bun.interlocking-route-coverage
- tester.bun.interlocking-production-runner-used
- tester.bun.interlocking-smoke-coverage-for-station-master
- tester.bun.interlocking-trace-binds-declared-route
emits_rule_ids:
- tester.bun.interlocking-route-coverage
- tester.bun.interlocking-production-runner-used
- tester.bun.interlocking-smoke-coverage-for-station-master
- tester.bun.interlocking-trace-binds-declared-route
entrypoint: detect.mjs
report: detect.mjs

# STAGED rule ids — declared, but NOT emitted by the gated family runner.
#
# `emits_rule_ids` is the contract for what `detect.mjs` surfaces, and conformance
# holds it to that: every entry needs a precision expectation and must fire on a
# dirty fixture through the family. A staged rule cannot meet those, because
# detect.mjs never collects it — it lives at the implementation root as
# `scan_execution.mjs`, deliberately outside checks/.
#
# Declaring it HERE rather than nowhere is the point. An emitted rule id that no
# manifest admits is a defect this hub has already fixed twice; "staged" must not
# become a way to hide one. conformance/test_staged_rules.py asserts each entry has
# a convention node, is genuinely absent from the gated output, and IS produced by
# the staged entry point on a tree that violates it.
staged_rule_ids:
  - tester.bun.interlocking-train-sequence-is-exercised
