# TESTER-persona discipline for the Bun + htmx stack. Scans TEST FILES ONLY; the
# five coder families in this provider scan source. That split is the persona
# boundary — an extension is scoped to one role, which is why every real stack in
# this hub ships a coder/tester PAIR rather than one package.
