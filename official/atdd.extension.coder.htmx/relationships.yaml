schema_version: "1.0.0"

# Extension-LOCAL relationship graph for atdd.extension.coder.htmx.
#
# CONFORMS TO CORE'S EDGE SCHEMA — src/atdd/planner/schemas/author/
# relationship.schema.json, "ATDD relationship edge (spec 6)". That schema
# defines a CLOSED type vocabulary (requires / blocks / enables / follows /
# awaits / triggered_by / starts_with / runs_alongside / finishes_with /
# relieves) plus typed metadata: foundation, constraint, control, strength,
# confidence, reason.
#
# The metadata is what an ad-hoc verb set reaches for and misses. `complements`
# is runs_alongside + mandatory + critical. `co-extracted-from` is
# runs_alongside + start_to_start. `refines` is requires + finish_to_start.
# Fewer verbs, more precision, and machine-checkable — every other extension in
# this hub (and core's own coach graph) currently uses types outside the enum,
# because nothing validates an extension's graph against it. This provider's
# conformance suite does.
#
# Cross-package linkage travels through metadata aliases, never an edge: an
# authored edge to a core node is refused by admission.
graph_id: atdd.extension.coder.htmx.relationships

nodes:
  - coder.htmx.verb-destructive-confirms
  - coder.htmx.verb-endpoint-same-origin
  - coder.htmx.fragment-escapes-interpolation
  - coder.htmx.verb-mutation-signals-progress
  - coder.htmx.swap-no-inline-handler
  - coder.htmx.swap-oob-carries-id

edges:
  - source_ref: coder.htmx.verb-destructive-confirms
    target_ref: coder.htmx.verb-mutation-signals-progress
    type: runs_alongside
    foundation: start_to_start
    constraint: mandatory
    control: internal
    strength: important
    confidence: 1.0
    reason: 'Both govern a mutating control: one guards INTENT before the request, the other FEEDBACK during it.'
  - source_ref: coder.htmx.swap-oob-carries-id
    target_ref: coder.htmx.swap-no-inline-handler
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'Both concern what survives a swap: an oob element needs an id to land, an inline handler dies when its node is replaced.'
  - source_ref: coder.htmx.fragment-escapes-interpolation
    target_ref: coder.htmx.verb-endpoint-same-origin
    type: runs_alongside
    foundation: start_to_start
    constraint: mandatory
    control: internal
    strength: critical
    confidence: 1.0
    reason: 'Both govern what reaches the live DOM: one the ORIGIN the markup came from, the other the DATA inside it.'
  - source_ref: coder.htmx.swap-no-inline-handler
    target_ref: coder.htmx.verb-destructive-confirms
    type: runs_alongside
    foundation: start_to_start
    constraint: discretionary
    control: internal
    strength: minor
    confidence: 1.0
    reason: 'Both replace imperative JavaScript with a declarative hx- attribute the swap lifecycle can see.'
  - source_ref: coder.htmx.verb-endpoint-same-origin
    target_ref: coder.htmx.verb-mutation-signals-progress
    type: runs_alongside
    foundation: start_to_start
    constraint: mandatory
    control: internal
    strength: important
    confidence: 1.0
    reason: 'Both read the same hx- verb attributes: one judges WHERE the request goes, the other what the user sees while it is in flight.'
