schema_version: "1.0.0"

# Extension-LOCAL relationship graph for atdd.extension.coder.htmx.
#
# Every edge below is AUTHORED and says something true about the pair. The
# vocabulary follows atdd.extension.coder.base, the one hand-curated graph in
# this hub:
#   refines            B adds a constraint that only applies once A holds
#   specializes        B is a narrower case of the general rule A
#   complements        two halves of one discipline; neither is complete alone
#   co-extracted-from  both fall out of one detector run or one parse
#   relates-to         same concern, weaker link
#
# Cross-package linkage is expressed through metadata aliases, never as an edge:
# an authored edge to a core node is refused by admission.
graph_id: atdd.extension.coder.htmx.relationships

nodes:
  - coder.htmx.destructive-verb-confirms
  - coder.htmx.endpoint-not-absolute-url
  - coder.htmx.fragment-interpolation-escaped
  - coder.htmx.mutation-signals-progress
  - coder.htmx.no-inline-event-handler
  - coder.htmx.oob-swap-carries-id

edges:
  - source_ref: coder.htmx.destructive-verb-confirms
    target_ref: coder.htmx.mutation-signals-progress
    type: complements
    reason: 'Both govern a mutating control: one guards INTENT before the request, the other FEEDBACK during it.'
  - source_ref: coder.htmx.oob-swap-carries-id
    target_ref: coder.htmx.no-inline-event-handler
    type: relates-to
    reason: 'Both are about what survives a swap — an oob element needs an id to land, an inline handler dies when its node is replaced.'
  - source_ref: coder.htmx.fragment-interpolation-escaped
    target_ref: coder.htmx.endpoint-not-absolute-url
    type: complements
    reason: 'Both govern what reaches the live DOM: one the ORIGIN the markup came from, the other the DATA inside it.'
  - source_ref: coder.htmx.no-inline-event-handler
    target_ref: coder.htmx.destructive-verb-confirms
    type: relates-to
    reason: 'Both replace imperative JavaScript with a declarative hx- attribute the swap lifecycle can see.'
