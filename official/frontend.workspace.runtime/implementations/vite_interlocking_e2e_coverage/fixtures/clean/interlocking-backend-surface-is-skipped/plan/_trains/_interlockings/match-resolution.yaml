# CLEAN fixture — a BACKEND route space the frontend must SKIP.
#
# It sits at the canonical path, beside the frontend's own documents, and declares
# `entrypoint.surfaces: [backend]`. Core's contract is that a consumer MUST skip a
# document whose surfaces omit its own side, so these routes are none of the frontend's
# business and no e2e spec is owed for them.
#
# This replaces the old `-backend-path` fixture. That one existed to prove the detector
# read BOTH paths, which was the non-breaking half while no discriminator existed. The
# discriminator exists now, so the question is no longer WHERE a document sits but WHAT
# it declares — and a frontend that reported on these routes would be reporting on the
# backend's.
