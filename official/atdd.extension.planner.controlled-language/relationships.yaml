schema_version: "1.0.0"

# Extension-LOCAL relationship graph for atdd.extension.planner.controlled-language.
#
# IMPORTANT (boundary spec §6.2): core<->extension edges are NOT authored here.
# The core planner surface these rules govern (`atdd author` output) is named
# narratively in atdd.extension.yaml and in the README, never as a graph edge.
# Only extension-internal edges live here.
# EDGE VOCABULARY MIGRATED to core's relationship.schema.json enum (spec 6).
# Each edge keeps its authored verb in `authored_type`, and the typed metadata
# below carries the nuance that verb implied: `complements` became
# runs_alongside + mandatory + critical, `refines` became requires +
# finish_to_start. Reasons are verbatim. See tools/validate_graphs.py.
graph_id: atdd.extension.planner.controlled-language.relationships

nodes:
  - planner.controlled-language.ste-conformance
  - planner.controlled-language.approved-vocabulary

edges:
  - source_ref: planner.controlled-language.approved-vocabulary
    target_ref: planner.controlled-language.ste-conformance
    type: runs_alongside
    foundation: start_to_start
    constraint: mandatory
    control: internal
    strength: critical
    confidence: 1.0
    authored_type: complements
    reason: 'Word choice and writing rules are the two layers of the same controlled language. One checker call answers both; the detector routes each finding to whichever rule owns it, so a repo that enforces one and not the other has a controlled language with a hole in it.'
