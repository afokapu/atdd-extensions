schema_version: 1.0.0
extension_id: atdd.extension.tester.base
version: 0.1.0
kind: extension
role: tester
flow_wagon: validate-test-surface
feature: tester-extension-conventions
owns:
  conventions:
  - conventions/tester.filename.urn.convention.yaml
  - conventions/tester.migration.naming.convention.yaml
  relationships:
  - relationships.yaml
  implementations: []
  schemas: []
  gates: []
  scopes: []
depends_on:
  # `core: []` — the five `atdd.core.*` ids previously listed here do not exist.
  # The 231 real core nodes are namespaced coder.* / tester.* / coach.*, and
  # admission never validates this field, so the declaration pointed at nothing.
  # An empty list is what `atdd author extension init` scaffolds.
  core: []
  workspaces:
  - id: atdd.workspace.python-pytest
    contract: ^1.0.0
  - id: atdd.workspace.supabase
    contract: ^1.0.0
  - id: atdd.workspace.fastapi
    contract: ^1.0.0
removal_policy:
  allowed_if_no_external_dependents: true
