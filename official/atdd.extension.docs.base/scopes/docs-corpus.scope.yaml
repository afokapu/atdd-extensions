schema_version: "1.0.0"

# Consumer-repo target selectors for the standard documentation extension.
#
# A scope binds a convention's enforcement to the consumer files it inspects. Every
# selector here describes the CANONICAL TREE of handoff spec 2 §4. The tree is this
# extension's knowledge and no part of it appears in core (companion §8's
# anti-theatre test).
#
# `docs/dist/**` is deliberately NOT a selector. It is render OUTPUT: excluded from
# the authored-format rule, never an input to the render, and never required to be
# declared. The detector excludes it by PATH rather than by gitignore status, so the
# check is identical whether or not the tree has been built.
scope_id: atdd.extension.docs.base.corpus

selectors:
  # --- the authored corpus: every document identity + relationship edge (§5) ---
  - id: authored_adoc
    description: Authored AsciiDoc documents. The corpus over which doc-id uniqueness and edge resolution are computed.
    include:
      - "docs/**/*.adoc"

  # --- format violations: markdown that survived (or bypassed) the migration (§4) ---
  - id: authored_markdown
    description: Markdown beneath docs/, which the authored-format rule rejects outside docs/dist/.
    include:
      - "docs/**/*.md"

  # --- canonical area indexes (§4) ---
  - id: area_index
    description: The index.adoc each authored area of the canonical tree must carry.
    include:
      - "docs/index.adoc"
      - "docs/purpose/index.adoc"
      - "docs/architecture/index.adoc"
      - "docs/architecture/decisions/index.adoc"
      - "docs/delivery/index.adoc"
      - "docs/archive/index.adoc"

  # --- architecture decision records + their derived registry (§6) ---
  - id: adr_files
    description: 'One decision per file, named adr-YYYYMMDD-NNN-<slug>.adoc, carrying the :decides: edge the registry is projected from.'
    include:
      - "docs/architecture/decisions/adr-*.adoc"

  - id: decision_registry
    description: 'The derived ADR registry. Compared against the projection of :decides: edges; never hand-maintained.'
    include:
      - "docs/architecture/decisions/index.adoc"

  # --- the archive: WHAT WAS, never promoted into current truth (§2) ---
  - id: archive
    description: Historical, non-current documents. Archive destinations outside this prefix are rejected.
    include:
      - "docs/archive/**/*.adoc"
